<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Noor ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#000;
overflow:hidden;
color:white;
}

/* ================= Intro ================= */

#intro{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(135deg,#000,#111,#222);
z-index:999;
}

#intro::before{
content:"";
position:absolute;
width:200%;
height:200%;
background:
radial-gradient(circle,#ffffff15 2px,transparent 2px);
background-size:50px 50px;
animation:move 20s linear infinite;
}

@keyframes move{
from{transform:translate(0,0);}
to{transform:translate(-300px,-300px);}
}

.content{
position:relative;
z-index:5;
text-align:center;
}

h1{
font-size:55px;
margin-bottom:20px;
}

h2{
font-size:28px;
color:#FFD700;
margin-bottom:50px;
}

button{
padding:18px 60px;
font-size:22px;
border:none;
border-radius:50px;
cursor:pointer;
background:linear-gradient(45deg,#ff0066,#ff5e62);
color:white;
transition:.4s;
box-shadow:0 0 25px #ff006688;
}

button:hover{
transform:scale(1.08);
box-shadow:0 0 50px #ff0066;
}

/* ================= Gallery ================= */

#gallery{

display:none;
width:100%;
height:100vh;
position:relative;
background:#000;
overflow:hidden;

}

.slide{

position:absolute;
width:100%;
height:100%;
opacity:0;
transform:scale(1.15);
transition:1.5s;

}

.slide.active{

opacity:1;
transform:scale(1);

}

.slide img{

width:100%;
height:100%;
object-fit:contain;

}

.overlay{

position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(to top,#000000aa,transparent);

}

.caption{

position:absolute;
bottom:60px;
left:60px;
font-size:40px;
font-weight:bold;
text-shadow:0 0 20px black;

}

/* Buttons */

.nav{

position:absolute;
top:50%;
transform:translateY(-50%);
font-size:45px;
cursor:pointer;
padding:20px;
background:#00000055;
border-radius:50%;
user-select:none;
transition:.3s;
z-index:20;

}

.nav:hover{

background:white;
color:black;

}

#prev{

left:20px;

}

#next{

right:20px;

}

/* Dots */

.dots{

position:absolute;
bottom:20px;
width:100%;
text-align:center;
z-index:50;

}

.dot{

display:inline-block;
width:14px;
height:14px;
border-radius:50%;
margin:5px;
background:white;
opacity:.4;
transition:.3s;

}

.dot.active{

opacity:1;
transform:scale(1.5);
background:#FFD700;

}

</style>

</head>

<body>

<!-- Intro -->

<div id="intro">

<div class="content">

<h1>Welcome To Egypt 🇪🇬</h1>

<h2>Noor ❤️</h2>

<button onclick="startGallery()">START</button>

</div>

</div>

<!-- Gallery -->

<div id="gallery">

<div class="slide active">
<img src="PIC/photo_2026-07-04_20-12-49.jpg" class="photo">
<div class="overlay"></div>
<div class="caption">❤️ Noor ❤️</div>
</div>

<div class="slide">
<img src="PIC/photo_2026-07-04_20-07-05.jpg" class="photo">
<div class="overlay"></div>
<div class="caption">Beautiful Moments ✨</div>
</div>

<div class="slide">
<img src="PIC/photo_2026-07-04_20-13-01.jpg">
<div class="overlay"></div>
<div class="caption">Welcome To Egypt 🇪🇬</div>
</div>

<div class="slide">
<img src="PIC/photo_2026-07-04_15-48-37.jpg">
<div class="overlay"></div>
<div class="caption">Smile 😊</div>
</div>

<div class="slide">
<img src="PIC/photo_2026-07-04_20-12-56.jpg">
<div class="overlay"></div>
<div class="caption">Forever ❤️</div>
</div>

<div id="prev" class="nav">&#10094;</div>

<div id="next" class="nav">&#10095;</div>

<div class="dots"></div>

</div>

<script>

const slides=document.querySelectorAll(".slide");
const dotsContainer=document.querySelector(".dots");

let index=0;
let timer;

slides.forEach((s,i)=>{

let d=document.createElement("span");
d.className="dot";
if(i==0)d.classList.add("active");
dotsContainer.appendChild(d);

});

const dots=document.querySelectorAll(".dot");

function showSlide(i){

slides.forEach(slide=>slide.classList.remove("active"));
dots.forEach(dot=>dot.classList.remove("active"));

slides[i].classList.add("active");
dots[i].classList.add("active");

}

function next(){

index++;

if(index>=slides.length) index=0;

showSlide(index);

}

function prev(){

index--;

if(index<0) index=slides.length-1;

showSlide(index);

}

document.getElementById("next").onclick=()=>{

next();
restart();

}

document.getElementById("prev").onclick=()=>{

prev();
restart();

}

function restart(){

clearInterval(timer);

timer=setInterval(next,3500);

}

function startGallery(){

document.getElementById("intro").style.display="none";
document.getElementById("gallery").style.display="block";

restart();

}

</script>

</body>
</html>
